# ??? Server ??????????????????????????????????????????????????????????????????
server.servlet.context-path=/api

# ??? Database ?????????????????????????????????????????????????????????????????
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 console is enabled only in application-dev.properties.
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration


jwt.secret=${JWT_SECRET:local-dev-secret-key-this-is-only-for-development-and-testing-ok}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# Base URL of the React frontend, used to build links (e.g. password reset) sent to users
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Set APP_CORS_ALLOWED_ORIGINS to the real frontend origin(s) in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_USERNAME:noreply@example.com}

# TODO: Implement the planned email verification flow before enabling emailVerified.

logging.level.com.store=INFO
logging.level.org.springframework.security=WARN
